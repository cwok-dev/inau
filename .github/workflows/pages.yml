name: 블로그 발행 (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ['posts/**', 'kit/**', 'tools/build-site.mjs', 'tools/render-cards.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 카드뉴스 렌더링 (글 수정 반영)
        run: |
          for f in posts/*/cards.json; do [ -f "$f" ] && node tools/render-cards.mjs "$(dirname "$f")"; done
          exit 0
      - run: node tools/build-site.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # 새 글이 배포되면 인스타 게시 승인 이슈를 만든다 → 댓글 /게시 로 instagram.yml 실행
  ig-queue:
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      BEFORE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 승인 이슈 만들기
        run: |
          before="$BEFORE"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then before="$GITHUB_SHA~1"; fi
          for d in $(git diff --name-only --diff-filter=A "$before" "$GITHUB_SHA" -- 'posts/*/index.md' | cut -d/ -f2); do
            n=$(gh issue list --label ig --state all --search "\"[$d]\" in:title" --json number -q length)
            [ "$n" = "0" ] || continue
            title=$(grep -m1 '^title:' "posts/$d/index.md" | sed 's/^title: *//; s/^"//; s/"$//')
            base="$SITE/posts/$d/cards"
            {
              echo "새 글이 블로그에 올라갔어요 → $SITE/posts/$d/"
              echo
              echo '**댓글로 `/게시` 를 남기면 아래 카드뉴스가 Instagram에 올라갑니다.** 올리지 않으려면 이슈를 닫으세요.'
              echo
              for i in 01 02 03 04 05 06 07 08 09 10; do
                curl -sfI "$base/card-$i.png" > /dev/null && echo "<img src=\"$base/card-$i.png\" width=\"260\">"
              done
              echo
              echo '### 캡션'
              echo '```'
              curl -sf "$base/caption.txt"
              echo
              echo '```'
            } > body.md
            url=$(gh issue create --label ig --title "📸 인스타 게시 대기: $title [$d]" --body-file body.md)
            echo "$url"
            if [ -n "$NTFY_TOPIC" ]; then
              curl -s -H "Title: 인스타 게시 승인 대기" -H "Priority: 5" -H "Tags: camera" -H "Click: $url" \
                -H "Actions: view, 카드 보기, $url" -d "$title" "https://ntfy.sh/$NTFY_TOPIC" > /dev/null
            fi
          done
