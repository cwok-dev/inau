<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="render-width" content="520"><link rel="stylesheet" href="../../../kit/wire.css"></head><body>
<div class="capture" data-capture>
<div class="phone">
  <div class="statusbar">9:41</div>
  <div class="appbar"><span class="ic ic-back"></span><div class="appbar-title">쿠폰 선택</div></div>
  <div class="screen">
    <div class="grid pt-2">
      <div class="span-4 notice info fix"><i class="n">1</i>주문금액 28,000원 기준으로 쓸 수 있는 쿠폰을 먼저 보여드려요</div>
    </div>
    <div class="section-title">지금 쓸 수 있는 쿠폰 2</div>
    <div class="grid gap-3">
      <div class="span-4 card selected fix"><i class="n">2</i>
        <div class="row gap-3"><div class="li-body"><div class="row gap-2"><span class="t-title3">무료배송</span><span class="tag primary">최대 할인</span></div><div class="t-caption1">배송비 3,000원 할인 · 조건 없음</div></div><span class="radio on"></span></div>
      </div>
      <div class="span-4 card">
        <div class="row gap-3"><div class="li-body"><span class="t-title3">2,000원</span><div class="t-caption1">리뷰 작성 감사 · 1만원 이상</div></div><span class="radio"></span></div>
      </div>
    </div>
    <div class="grid pt-6"><div class="span-4 row fix pad"><i class="n">3</i><div class="grow t-title3 c-sub">조건이 안 맞는 쿠폰 5</div><span class="t-label c-sub">펼치기</span></div></div>
    <div class="grid gap-3 pt-2">
      <div class="span-4 card filled"><div class="li-body"><span class="t-title3 c-hint">15%</span><div class="t-caption1">22,000원 더 담으면 쓸 수 있어요</div></div></div>
      <div class="span-4 card filled"><div class="li-body"><span class="t-title3 c-hint">5,000원</span><div class="t-caption1">뷰티 상품 전용</div></div></div>
    </div>
  </div>
  <div class="cta bordered"><button class="btn btn-l btn-primary btn-block">3,000원 할인 적용하기</button></div>
  <div class="homebar"></div>
</div>
</div></body></html>
