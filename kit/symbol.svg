<!-- INAU 심볼: 비대칭 하트 + 토끼 귀(오른쪽 귀에 커서 화살표). 색은 currentColor. tools/make-brand.mjs 가 로고에 합친다 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -16 94 122" role="img" aria-label="INAU">
  <defs>
    <path id="inau-ear-l" d="M47.5 47 C 41 40, 29 26, 25 9 C 22.5 -2, 25 -13, 31.5 -12 C 38 -11, 43 2, 46 14 C 48.5 25, 50 36, 49.5 45 Z"/>
    <path id="inau-ear-r" d="M51 45 C 52 32, 57 14, 66 -1 C 71 -9, 79 -11, 80.5 -5 C 82 3, 77 20, 70 31 C 65 39, 59 44, 53 48.5 Z"/>
    <mask id="inau-gap" maskUnits="userSpaceOnUse" x="0" y="-16" width="94" height="122">
      <rect x="0" y="-16" width="94" height="122" fill="#fff"/>
      <use href="#inau-ear-l" fill="#000" stroke="#000" stroke-width="7" stroke-linejoin="round"/>
      <use href="#inau-ear-r" fill="#000" stroke="#000" stroke-width="7" stroke-linejoin="round"/>
    </mask>
    <mask id="inau-arrow" maskUnits="userSpaceOnUse" x="0" y="-16" width="94" height="122">
      <rect x="0" y="-16" width="94" height="122" fill="#fff"/>
      <path d="M58 38 L 71 6" stroke="#000" stroke-width="3.6" stroke-linecap="round"/>
      <path d="M65.2 8.6 L 72 3.6 L 75.6 11.2" fill="none" stroke="#000" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>
  <g fill="currentColor">
    <path mask="url(#inau-gap)" d="M43 105 C 21 90, 2 71, 2 50 C 2 34, 13 24, 26 24 C 36 24, 44 31, 48.5 41 C 52.5 36.5, 58 34.5, 64.5 34.5 C 78 34.5, 90 44.5, 90 58.5 C 90 75, 70 90.5, 43 105 Z"/>
    <use href="#inau-ear-l"/>
    <use href="#inau-ear-r" mask="url(#inau-arrow)"/>
  </g>
</svg>
